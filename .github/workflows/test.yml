name: Tests

on:
  push:
    tags-ignore:
      - '*'
    branches:
      - 'master'
      - 'main'
  pull_request:
    branches:
      - 'master'
      - 'main'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Find changed files
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          [[ -z "$BASE_SHA" ]] && BASE_SHA=$(git rev-parse "$HEAD_SHA^" 2>/dev/null || echo 0)
          # a shallow clone may not contain the base commit: fetch it, or fall back to linting everything
          [[ "$BASE_SHA" =~ ^0+$ ]] || git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch -q --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || BASE_SHA=0
          [[ "$BASE_SHA" =~ ^0+$ ]] && BASE_SHA=$(git hash-object -t tree /dev/null)
          git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"
          for t in prettier eslint markdown svg; do : > "$RUNNER_TEMP/$t-files"; done
          while IFS= read -r -d '' f; do
            [[ -f "$f" ]] || continue
            printf '%s\0' "$f" >> "$RUNNER_TEMP/prettier-files"
            case "$f" in
              *.js|*.cjs|*.mjs|*.jsx|*.ts|*.tsx) t=eslint ;; *.md) t=markdown ;; *.svg) t=svg ;; *) continue ;;
            esac
            printf '%s\0' "$f" >> "$RUNNER_TEMP/$t-files"
          done < "$RUNNER_TEMP/changed-files"
      - name: Prettier
        run: xargs -0 -r npx prettier --log-level=error --ignore-unknown --check -- < "$RUNNER_TEMP/prettier-files"
      - name: ESLint
        run: xargs -0 -r npx eslint --quiet -- < "$RUNNER_TEMP/eslint-files"
      - name: remark
        run: xargs -0 -r npx remark --quiet --frail -- < "$RUNNER_TEMP/markdown-files"
      - name: SVGLint
        run: xargs -0 -r npx svglint --no-summary --ci -- < "$RUNNER_TEMP/svg-files"
      - name: Check SVG optimization
        run: xargs -0 -r npm run lint:svgo -- < "$RUNNER_TEMP/svg-files"

  test:
    needs: lint
    name: Node.js ${{ matrix.node }} | ${{ matrix.os }} | ${{ matrix.arch }}
    strategy:
      max-parallel: 3
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        # https://code.visualstudio.com/updates
        # https://www.electronjs.org/releases/stable
        # https://github.com/microsoft/vscode/blob/main/package.json#L138
        # https://github.com/ewanharris/vscode-versions
        node:
          # - 24.18.0 # vscode >= 1.129.0 <= 1.133.0 - Jul-Aug 2026
          # - 24.17.0 # vscode >= 1.128.0 <= 1.128.1 - July 2026
          - 24.15.0 # vscode >= 1.123.0 <= 1.127.0 - June 2026
          - 22.18.0 # vscode >= 1.104.0 <= 1.104.3 - August 2025
        arch:
          - x64
        experimental:
          - false
        include:
          - os: ubuntu-latest
            node: node # latest node
            experimental: true
          - os: macos-latest
            node: node # latest node
            experimental: true
          - os: windows-latest
            node: node # latest node
            experimental: true
          - os: ubuntu-latest
            node: lts/* # latest lts node
            experimental: true
          - os: macos-latest
            node: lts/* # latest lts node
            experimental: true
          - os: windows-latest
            node: lts/* # latest lts node
            experimental: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setting up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      - name: Cloning repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 5

      - name: Installing Dependencies
        run: npm ci

      # - name: Setup tmate session
      #   if: (matrix.os == 'ubuntu-latest' && matrix.node == '22.18.0')
      #   uses: mxschmitt/action-tmate@v3

      - name: Test
        continue-on-error: ${{ matrix.experimental }}
        run: npm test

      - name: Upload coverage to Codecov
        if: |
          success() &&
          matrix.os == 'ubuntu-latest' &&
          matrix.node == '22.18.0' &&
          github.repository_owner == 'vscode-icons' &&
          github.actor != 'dependabot[bot]' &&
          (github.event_name == 'push' || github.event_name == 'pull_request')
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
