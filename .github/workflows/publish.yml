name: Publish Extension

env:
  NODE_VERSION: 22.18.0

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'vscode-icons/vscode-icons'
    runs-on: ubuntu-latest
    steps:
      - name: Setting up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cloning repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Package Extension
        id: packageExtension
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: stub
          dryRun: true

      - name: Upload VSIX file to GitHub Releases
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true
          file: ${{ steps.packageExtension.outputs.vsixPath }}
          overwrite: true
          tag: ${{ github.ref }}

      - name: Publish to Open VSX Registry
        continue-on-error: true
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.OPEN_VSX_TOKEN }}
          extensionFile: ${{ steps.packageExtension.outputs.vsixPath }}

      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v1
        with:
          pat: ${{ secrets.VSCE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          extensionFile: ${{ steps.packageExtension.outputs.vsixPath }}

  notify-zed:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify vscode-icons-zed of new release
        uses: peter-evans/repository-dispatch@v4
        with:
          # PAT with repo scope, since GITHUB_TOKEN can't dispatch to another repository
          token: ${{ secrets.ZED_SYNC_PAT }}
          repository: vscode-icons/vscode-icons-zed
          event-type: icons-updated
